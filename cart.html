<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | CluckCart Poultry</title>
  <meta name="description" content="Review the chickens in your CluckCart Poultry shopping cart, adjust quantities and continue to checkout.">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-banner">
      <div class="container">
        <p class="breadcrumb"><a href="index.html">Home</a> / Shopping Cart</p>
        <h1>Your Shopping Cart</h1>
        <p>Check the quantities and availability before you continue to checkout.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <!-- ============ EMPTY CART STATE ============ -->
        <div class="empty-state" id="cart-empty" style="display:none">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          </div>
          <h3>Your cart is empty</h3>
          <p>You have not added any chickens yet. Browse the catalogue and pick the right age group for your flock.</p>
          <a class="btn btn-green" href="shop.html">Start shopping</a>
        </div>

        <!-- ============ CART CONTENT ============ -->
        <div class="cart-layout" id="cart-section">
          <div class="cart-panel">
            <div class="cart-head">
              <span>Product</span>
              <span>Details</span>
              <span>Quantity</span>
              <span>Total</span>
              <span></span>
            </div>
            <div id="cart-items">
              <!-- Filled by js/cart.js -->
            </div>
          </div>

          <aside class="summary-panel" id="cart-summary">
            <!-- Filled by js/cart.js -->
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/products.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
